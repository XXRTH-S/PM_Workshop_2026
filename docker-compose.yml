# PM_WorkShop_2025 — โหมด Dev (hot reload)
# DB ไม่ได้อยู่ใน container — ชี้ออกไปที่ MS SQL Server บนเครื่อง host
# รัน: docker compose up --build

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    env_file:
      - ./server/.env # โหลด DATABASE_URL / PORT (host จะถูกแก้เป็น host.docker.internal ใน entrypoint)
    environment:
      - SEED_ON_START=true
    extra_hosts:
      - "host.docker.internal:host-gateway" # ให้ container เห็น SQL Server บนเครื่อง host
    ports:
      - "4000:4000"
    volumes:
      - ./server:/app # bind mount source → แก้โค้ดแล้ว ts-node-dev รีโหลดเอง
      - server_node_modules:/app/node_modules # กัน node_modules ของ Windows ทับ (Prisma engine คนละ platform)
    command: npm run dev

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    environment:
      - VITE_PROXY_TARGET=http://server:4000 # proxy /api → service "server"
      - VITE_USE_POLLING=true # HMR ผ่าน bind mount บน Windows
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - server

volumes:
  server_node_modules:
  web_node_modules:
